[package]
name = "voicebox"
version = "0.5.0"
description = "A production-quality desktop app for Qwen3-TTS voice cloning and generation"
authors = ["you"]
license = ""
repository = ""
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.0", features = [] }
# JFW-12 B9: Build-ID-Ableitung aus dem Produktprofil (kompaktes kanonisches JSON).
serde_json = "1"
sha2 = "0.10"

[dependencies]
tauri = { version = "2.0", features = ["macos-private-api"] }
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-shell = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["blocking", "json", "stream", "multipart"] }
hound = "3.5"
base64 = "0.22"
futures-util = "0.3"
cpal = "0.15"
symphonia = { version = "0.5", features = ["all"] }
scopeguard = "1.2.0"
rand = "0.8"
# JFW-12 B3/B9: app_epoch (UUIDv4) und Artefakt-/Operations-Identitäten.
uuid = { version = "1", features = ["v4"] }
# JFW-12 B8: Executable-Hash fuer die vollstaendige Prozessidentitaet.
sha2 = "0.10"
minisign-verify = "0.2.5"
tar = "0.4"
flate2 = "1"

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "1", features = ["async"] }
coreaudio-sys = "0.2"
objc = "0.2"
core-foundation-sys = "0.8"

[target.'cfg(target_os = "windows")'.dependencies]
wasapi = "0.22"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Threading",
    # JFW-12 B8: Job Objects (KILL_ON_JOB_CLOSE) + Pipes fuer den Sidecar-Spawner.
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_Storage_FileSystem",
    "Win32_Security",
] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = "2.0"
# Observe-only global keyboard tap. Covers macOS, Windows, and Linux
# (evdev) with left/right modifier fidelity, which is the hard
# requirement the chord engine needs. keytap is our own crate
# (jamiepine/keytap), published to crates.io, that replaces the
# abandoned Narsil/rdev we previously pinned via git — same capability
# surface, clean shutdown via Drop, no `set_is_main_thread(false)`
# dance required (the Sonoma-crashing layout-translation path simply
# isn't called).
keytap = "0.4"

[features]
# This feature is used for production builds or when `devPath` points to the filesystem
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
minisign = "0.9"
tempfile = "3"

# Alembic — JFW-1 Schema-Linie (kanonisch).
#
# Die Revisionen in alembic/versions sind die einzige Quelle fuer das DB-Schema.
# init_db() (backend/database/session.py) laeuft `alembic upgrade head` aus;
# der CPU-Early-Entrypoint ist backend/schema.py.
#
# Das DB-Pfad wird zur Laufzeit gesetzt: env.py liest JFWHISPER_DB_URL,
# das backend/schema.py (bzw. init_db) vor dem Aufruf exportiert.

[alembic]
script_location = alembic
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr, NONE)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
